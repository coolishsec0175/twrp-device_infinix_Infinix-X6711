name: Build - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-11
        - twrp-9.0
        - twrp-8.1
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/coolishsec0175/twrp_device_infinix_X6711_boot'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/infinix/X6711'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'X6711'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCheck'
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'vendor/bin/mcDriverDaemon'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    outputs:
      start_epoch: ${{ steps.start.outputs.epoch }}
      commit_id: ${{ steps.clone.outputs.commit_id }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Started
      id: start
      run: |
        echo "BUILD_START_EPOCH=$(date +%s)" >> $GITHUB_ENV
        echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Display Inputs
      run: |
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"

    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Cache CCACHE
      id: ccache-cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-twrp-${{ github.event.inputs.MANIFEST_BRANCH }}-v1
        restore-keys: |
          ccache-${{ runner.os }}-twrp-

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/sounddrill31/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        sed -i '/<remove-project name="platform\/external\/gflags"  \/>/d' .repo/manifests/remove-minimal.xml

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      id: clone
      run: |
        cd android-recovery
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "commit_id=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Check Build Makefile
      run: |
        cd android-recovery
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile file found!"
        fi
      continue-on-error: true

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'
      run: |
        sudo apt -y install python
        sudo rm -rf /usr/bin/python
        sudo ln -s /usr/bin/python2 /usr/bin/python
      continue-on-error: true

    - name: Building Image
      run: |
        export CCACHE_DIR=~/.ccache
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G || true
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Collect Image
      run: |
        cd android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        echo "--- Output dir contents:"
        ls -la
        if [ -f boot.img ]; then
          echo "RELEASE_IMG=android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img" >> $GITHUB_ENV
        elif [ -f recovery.img ]; then
          echo "RELEASE_IMG=android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img" >> $GITHUB_ENV
        elif [ -f vendor_boot.img ]; then
          echo "RELEASE_IMG=android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img" >> $GITHUB_ENV
        else
          echo "::error::No recovery image found in out/target/product/${{ github.event.inputs.DEVICE_NAME }}/"
          exit 1
        fi

    - name: Upload to Release
      if: env.RELEASE_IMG != ''
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.RELEASE_IMG }}
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Upload Image Artifact
      if: always() && env.RELEASE_IMG != ''
      uses: actions/upload-artifact@v4
      with:
        name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: ${{ env.RELEASE_IMG }}

    - name: Run LDCheck
      if: github.event.inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies."
      continue-on-error: true

  notify-started:
    name: Notify Telegram (started)
    runs-on: ubuntu-22.04
    steps:
      - name: Send started alert
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not set. Skipping notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          START_TS="$(date +"%m/%d/%y %I:%M %p")"
          MSG="$(printf '%b' "<b>⚙️ TWRP Build Started</b>\n📋 <b>Workflow:</b> Build - TWRP\n📱 <b>Device:</b> Infinix X6711\n🌿 <b>Tree Branch:</b> <code>${{ github.event.inputs.DEVICE_TREE_BRANCH }}</code>\n🧬 <b>Build:</b> <code>${{ github.event.inputs.BUILD_TARGET }}</code> | <code>${{ github.event.inputs.MANIFEST_BRANCH }}</code>\n🔍 <a href=\"${RUN_URL}\">Watch on GitHub Actions</a>\n[${START_TS}]")"
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_CHAT_ID}" --data-urlencode text="$MSG" -d parse_mode="HTML" -d disable_web_page_preview=true

  notify-done:
    name: Notify Telegram (done)
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Send completion alert
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not set. Skipping notification."
            exit 0
          fi
          START_EPOCH="${{ needs.build.outputs.start_epoch }}"
          COMMIT_ID="${{ needs.build.outputs.commit_id }}"
          [ -z "$START_EPOCH" ] && START_EPOCH=$(date +%s)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_LINK="https://github.com/${{ github.repository }}/releases/tag/${{ github.run_id }}"
          END_TIME=$(date +%s)
          DURATION_SECS=$((END_TIME - START_EPOCH))
          DURATION=$(printf '%02d:%02d:%02d' $((DURATION_SECS/3600)) $(((DURATION_SECS%3600)/60)) $((DURATION_SECS%60)))
          SHORT_COMMIT=$(echo "$COMMIT_ID" | cut -c1-7)
          JOB_STATUS="${{ needs.build.result }}"
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="$(printf '%b' "<b>✅ TWRP Build Completed</b>\n📱 <b>Device:</b> Infinix X6711\n⏱ <b>Duration:</b> ${DURATION}\n🧬 <b>Build:</b> <code>${{ github.event.inputs.BUILD_TARGET }}</code> | <code>${{ github.event.inputs.MANIFEST_BRANCH }}</code>\n🔧 <b>Commit:</b> <code>${SHORT_COMMIT}</code>\n📥 <a href=\"${RELEASE_LINK}\">Download from Releases</a>\n🔍 <a href=\"${RUN_URL}\">View on GitHub Actions</a>")"
          else
            MSG="$(printf '%b' "<b>❌ TWRP Build Failed</b>\n📱 <b>Device:</b> Infinix X6711\n⏱ <b>Duration:</b> ${DURATION}\n🧬 <b>Build:</b> <code>${{ github.event.inputs.BUILD_TARGET }}</code> | <code>${{ github.event.inputs.MANIFEST_BRANCH }}</code>\n🔧 <b>Commit:</b> <code>${SHORT_COMMIT}</code>\n🔍 <a href=\"${RUN_URL}\">View on GitHub Actions</a>")"
          fi
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_CHAT_ID}" --data-urlencode text="$MSG" -d parse_mode="HTML" -d disable_web_page_preview=true
