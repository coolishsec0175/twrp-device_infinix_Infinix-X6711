name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
        - '11.0'
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/coolishsec0175/twrp-device_infinix_Infinix-X6711'
        type: string
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox-12.1'
        type: string
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/infinix/X6711'
        type: string
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'X6711'
        type: string
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'vendor/bin/mcDriverDaemon'
        type: string

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Build Started
      run: echo "BUILD_START_EPOCH=$(date +%s)" >> $GITHUB_ENV

    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Setup Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "coolishsec0175"
        git config --global user.email "coolishsec0175@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree & Inject Hook Script
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        
        # Inject postrecoveryboot.sh into the cloned device tree root
        mkdir -p recovery/root/system/bin
        if [ -f "${GITHUB_WORKSPACE}/patches/postrecoveryboot.sh" ]; then
          cp ${GITHUB_WORKSPACE}/patches/postrecoveryboot.sh recovery/root/system/bin/postrecoveryboot.sh
          chmod +x recovery/root/system/bin/postrecoveryboot.sh
          echo "Successfully injected postrecoveryboot.sh script."
        fi

    - name: Apply OrangeFox Source Patches
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -f "${GITHUB_WORKSPACE}/patches/ofox_startup_reload_fix.patch" ]; then
          git apply --recount --3way ${GITHUB_WORKSPACE}/patches/ofox_startup_reload_fix.patch
          echo "Applied ofox_startup_reload_fix: validate/discard stale themes + skip startup theme reload"
        fi

    - name: Check Manifest Branch & Set Build Command
      uses: haya14busa/action-cond@v1
      id: fox_branch
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
        if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        set -e
        ${{ steps.fox_branch.outputs.value }}

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check Artifact Outputs
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Image output not found."
        fi
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "ZIP output not found."
        fi

    - name: Upload to GitHub Release
      if: env.CHECK_IMG_IS_OK == 'true' || env.CHECK_ZIP_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device Tree: [Device Tree](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit Hash: [`${{ env.COMMIT_ID }}`](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
          MD5 (img): `${{ env.MD5_IMG }}`
          MD5 (zip): `${{ env.MD5_ZIP }}`

    - name: Run LDCheck
      if: github.event.inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies."
      continue-on-error: true

    - name: Send Telegram Notification
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RECOVERY_NAME: OFRP
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "Telegram secrets not set. Skipping notification."
          exit 0
        fi
        START_TIME=$(date -u -d "@$BUILD_START_EPOCH" +"%H:%M:%S UTC")
        END_TIME=$(date +%s)
        DURATION_SECS=$((END_TIME - BUILD_START_EPOCH))
        DURATION=$(printf '%02d:%02d:%02d' $((DURATION_SECS/3600)) $(((DURATION_SECS%3600)/60)) $((DURATION_SECS%60)))
        SHORT_COMMIT=$(echo "$COMMIT_ID" | cut -c1-7)
        JOB_STATUS="${{ job.status }}"
        RELEASE_LINK="https://github.com/${{ github.repository }}/releases/tag/${{ github.run_id }}"
        if [ "$JOB_STATUS" = "success" ]; then
          CAPTION=$(printf '✅ Build Completed for Recovery on %s\nStarted: %s\nDuration: %s\n📊 Build: %s\n\n🔧 Configuration:\n- Commit: <code>%s</code>\n\n📥 <a href="%s">Download from Releases</a>' "${{ github.event.inputs.DEVICE_NAME }}" "$START_TIME" "$DURATION" "$RECOVERY_NAME" "$SHORT_COMMIT" "$RELEASE_LINK")
        else
          CAPTION=$(printf '❌ Build Failed for Recovery on %s\nStarted: %s\nDuration: %s\n📊 Build: %s\n\n🔧 Configuration:\n- Commit: <code>%s</code>' "${{ github.event.inputs.DEVICE_NAME }}" "$START_TIME" "$DURATION" "$RECOVERY_NAME" "$SHORT_COMMIT")
        fi
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="${CAPTION}" \
          -d parse_mode="HTML"